[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SrPlugin/SebastianFan"
authors = ["SrPlugin <sebastianrcheikh@gmail.com>"]

[workspace.dependencies]
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
predicates = "3"
sebastianfan-core = { path = "crates/sebastianfan-core", version = "0.1.0" }
sebastianfan-daemon = { path = "crates/sebastianfan-daemon", version = "0.1.0" }
sebastianfan-sysfs = { path = "crates/sebastianfan-sysfs", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"
tempfile = "3"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
